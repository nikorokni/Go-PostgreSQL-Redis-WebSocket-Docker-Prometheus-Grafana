services:
  risk-engine:
    build: .
    ports: ["8080:8080"]
    environment: ["HTTP_ADDR=:8080", "DATABASE_URL=postgres://risk:risk@postgres:5432/risk?sslmode=disable", "REDIS_ADDR=redis:6379"]
    depends_on: [postgres, redis]
  postgres:
    image: postgres:16-alpine
    environment: ["POSTGRES_USER=risk", "POSTGRES_PASSWORD=risk", "POSTGRES_DB=risk"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
  prometheus:
    image: prom/prometheus:v2.55.1
    ports: ["9090:9090"]
    volumes: ["./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
  grafana:
    image: grafana/grafana:11.4.0
    ports: ["3000:3000"]
    environment: ["GF_SECURITY_ADMIN_USER=admin", "GF_SECURITY_ADMIN_PASSWORD=admin"]
    volumes: ["./deploy/grafana/provisioning:/etc/grafana/provisioning:ro"]
volumes:
  postgres-data:
